<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع خاص - Salma Abdo</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 1.2em; line-height: 1.6; }
        .heart { font-size: 4em; color: #ff2a2a; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Salma Abdo</h1>
        <p>أجمل صدفة في حياتي، الموقع ده معمول خصيصاً عشان أقولك إن وجودك بيخلي كل حاجة أحلى وأجمل بكتير! 🌸</p>
        <p>ربنا ما يحرمني منك أبداً يا غالية ❤️</p>
    </div>
<div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
  <img src="1.jpg" width="220" style="border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
  
  <audio controls src="music.mp3" style="width: 280px; height: 40px; margin: 10px 0;"></audio>
  </div>
  </body>
</html>
